<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>PWA 本機驗證</title><style>body{font:16px system-ui;margin:24px;background:#f8f6ef}pre{white-space:pre-wrap}img{width:96px;height:96px}</style><h1>尋找班導 PWA 本機驗證</h1><p>測試專用頁，不包含於發佈檔。</p><button id="check">檢查</button><pre id="results">按檢查讀取 Chrome 的 PWA 狀態。</pre><img src="/teacher-sudoku/dist/icons/app-192.png"><img src="/teacher-sudoku/dist/icons/app-512.png"><script>
check.onclick=async()=>{try{const base=new URL('/teacher-sudoku/dist/',location.origin),m=await fetch(new URL('manifest.webmanifest',base),{cache:'no-store'}),manifest=await m.json(),reg=await navigator.serviceWorker.getRegistration(base.href),keys=await caches.keys(),cached=[];for(const name of keys){if(name.startsWith('teacher-sudoku:'+base.href+':')){const cache=await caches.open(name);cached.push({name,assets:(await cache.keys()).map(r=>r.url)})}}const icons=[];for(const icon of manifest.icons){const response=await fetch(new URL(icon.src,base),{cache:'no-store'});icons.push({url:response.url,status:response.status,mime:response.headers.get('content-type')})}results.textContent=JSON.stringify({manifest:{status:m.status,mime:m.headers.get('content-type'),name:manifest.name,display:manifest.display,start_url:new URL(manifest.start_url,base).href,scope:new URL(manifest.scope,base).href},icons,serviceWorker:reg?{scope:reg.scope,active:reg.active?.state,script:reg.active?.scriptURL,waiting:reg.waiting?.state}:null,caches:cached},null,2)}catch(e){results.textContent=e.stack}};
</script></html>
