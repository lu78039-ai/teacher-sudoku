<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>更新尋找班導</title><style>body{margin:0;background:#f8f6ef;color:#303c32;font:16px system-ui,'Microsoft JhengHei',sans-serif;display:grid;min-height:100dvh;place-items:center}main{box-sizing:border-box;width:min(92vw,480px);padding:24px;background:#fffefa;border:1px solid #e0e5d6;border-radius:20px}h1{font-size:24px}p{line-height:1.7}button,a{box-sizing:border-box;display:block;width:100%;min-height:48px;padding:12px;border:0;border-radius:10px;background:#647e50;color:white;font:inherit;text-align:center;text-decoration:none;margin-top:12px}button:disabled{opacity:.5}a[hidden]{display:none}small{overflow-wrap:anywhere}</style></head><body><main><h1>更新尋找班導</h1><p>載入完整新版，保留遊戲進度與最佳時間。</p><p id="status" role="status">準備檢查遊戲版本。</p><small id="version"></small><button id="update">檢查並載入最新版</button><a id="play" hidden>開啟遊戲</a></main><script>
const base=new URL('./',location.href),scope=new URL('dist/',base),button=document.querySelector('#update'),status=document.querySelector('#status'),play=document.querySelector('#play');
function workerState(worker,states){return new Promise((resolve,reject)=>{let timer;function done(error){clearTimeout(timer);worker.removeEventListener('statechange',check);error?reject(error):resolve(worker)}function check(){if(states.includes(worker.state))done();else if(worker.state==='redundant')done(Error('資源版本不一致或下載失敗，請確認已完整部署新版 dist。'))}worker.addEventListener('statechange',check);timer=setTimeout(()=>done(Error('下載逾時，請連線後再試一次。')),60000);check()})}
function info(worker){return new Promise((resolve,reject)=>{const channel=new MessageChannel(),timer=setTimeout(()=>{channel.port1.close();reject(Error('離線程式仍為舊版，請確認已上傳新版 sw.js。'))},8000);channel.port1.onmessage=e=>{clearTimeout(timer);channel.port1.close();resolve(e.data)};worker.postMessage({type:'GET_VERSION'},[channel.port2])})}
button.onclick=async()=>{button.disabled=true;play.hidden=true;try{
 if(!('serviceWorker' in navigator))throw Error('請使用支援安裝的 Chrome，並透過 HTTPS 開啟。');
 status.textContent='正在檢查最新版…';const response=await fetch(new URL('release.json',scope),{cache:'no-store'});if(!response.ok)throw Error('找不到版本資料，請完整上傳新版 dist 資料夾。');const release=await response.json();if(typeof release.version!=='string'||!Number.isInteger(release.levelCount))throw Error('版本資料格式不正確。');
 const registration=await navigator.serviceWorker.register(new URL('sw.js',scope),{scope:scope.href,updateViaCache:'none'});if(!registration.installing)await registration.update();
 let worker=registration.waiting||registration.installing;
 if(worker){status.textContent='正在下載並校驗完整遊戲…';await workerState(worker,['installed','activated']);if(worker.state!=='activated'){worker.postMessage({type:'ACTIVATE_UPDATE'});await workerState(worker,['activated'])}}
 else worker=registration.active;
 if(!worker)throw Error('離線程式尚未準備好，請再試一次。');
 const installed=await info(worker);if(installed.version!==release.version||installed.levelCount!==release.levelCount)throw Error('頁面與題庫版本不一致，請確認已完整部署新版檔案後再試。');
 status.textContent='最新版已就緒，共 '+installed.levelCount+' 關。';document.querySelector('#version').textContent='版本 '+installed.version;button.hidden=true;play.href=new URL('index.html',scope).href;play.hidden=false;
 }catch(error){status.textContent=error.message;button.disabled=false}};
</script></body></html>
